<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073f2b">
<title>PRATES A CONHECER — Portfólio PDC</title>
<link rel="icon" type="image/svg+xml" href="assets/zona-favicon.svg?v=45">
<meta name="description" content="Uma infância contada por quem estava lá — portfólio de Psicologia do Desenvolvimento da Criança.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#073f2b;--sage:#b7d99a;--lime:#d7ef9a;--cream:#f3f4ed;--pink:#e8a1a9;--ink:#183328}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif}
body{min-height:100svh;background:var(--forest);color:var(--cream);overflow:hidden}
main{min-height:100svh;display:grid;place-items:center;padding:28px;position:relative;isolation:isolate}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(1px);pointer-events:none}
.blob.one{width:min(75vw,760px);aspect-ratio:1;background:#7bbd6826;left:-25%;bottom:-55%;animation:float 12s ease-in-out infinite}
.blob.two{width:min(42vw,420px);aspect-ratio:1;background:#e8a1a91c;right:-12%;top:-25%;animation:float 15s ease-in-out infinite reverse}
.card{width:min(100%,680px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.kicker{font:500 10px "DM Mono",monospace;letter-spacing:.2em;color:#c7ddc7}
.brand{font-size:clamp(12px,2vw,14px);font-weight:800;letter-spacing:.18em;color:var(--lime)}
.mascot{width:clamp(90px,17vw,145px);height:auto;object-fit:contain;filter:drop-shadow(0 14px 22px #001e1266);animation:bob 3.5s ease-in-out infinite}
.message{font-size:clamp(28px,5.6vw,54px);line-height:1.02;letter-spacing:-.065em;font-weight:800;max-width:650px;min-height:2.1em;display:grid;place-items:center;text-wrap:balance}
.sub{font-size:14px;line-height:1.6;color:#d0dfd1;max-width:430px;min-height:3em}
.track{width:min(100%,390px);height:5px;background:#ffffff26;border-radius:99px;overflow:hidden}
.track span{display:block;width:0;height:100%;background:var(--lime);border-radius:inherit;transition:width .15s linear}
.foot{width:min(100%,390px);display:flex;justify-content:space-between;color:#c7ddc7;font:10px "DM Mono",monospace;letter-spacing:.12em}
.skip{margin-top:8px;border:1px solid #d7ef9a88;border-radius:999px;padding:12px 19px;background:#ffffff0d;color:var(--cream);font:700 12px "DM Sans",sans-serif;cursor:pointer;transition:.2s}
.skip:hover{background:#ffffff20;transform:translateY(-2px)}
.skip:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
.note{font:10px "DM Mono",monospace;color:#b7d99a99;letter-spacing:.12em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes float{50%{transform:translate(25px,-20px) scale(1.05)}}
@media(max-width:520px){main{padding:24px 20px}.card{gap:18px}.sub{font-size:13px}.message{min-height:2.5em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="blob one"></div><div class="blob two"></div>
<section class="card" aria-live="polite">
<div class="brand">PRATES A CONHECER</div>
<div class="kicker">PORTFÓLIO PDC · UFBA · 2026</div>
<img class="mascot" src="assets/zeca.svg?v=44" alt="Zeca, o camaleão">
<div class="message" id="message">Olá, Juliana. Como você está?</div>
<p class="sub" id="sub">Estamos preparando uma pequena viagem pela memória.</p>
<div class="track" aria-label="Progresso do carregamento"><span id="progress"></span></div>
<div class="foot"><span>PREPARANDO SUA VISITA</span><span id="percent">00%</span></div>
<button class="skip" id="skip" type="button">Pular e abrir o portfólio ↗</button>
<div class="note">RATOS DE BROFEM BRENER</div>
</section>
</main>
<script>
(()=>{
const DESTINATION="https://herdata.my.canva.site/portifolio-pdc";
const messages=[
["Olá, Juliana. Como você está?","Que bom receber sua visita."],
["Aguarde, estamos preparando tudo para você.","Estamos organizando algumas memórias."],
["O Zeca é o nosso mascote. Você vai gostar dele.","Ele vai acompanhar você nessa experiência."],
["Algumas lembranças estão nas fotografias.","Outras vivem na memória de quem estava lá."],
["Quase tudo pronto.","Pode preparar o café."],
["Ratos de Brofem Brener.","Essa é para quem vai entender."],
["Pronto, Juliana. Pode entrar.","Sua apresentação está logo ali."]
];
const duration=14000;
const message=document.getElementById("message"),sub=document.getElementById("sub"),progress=document.getElementById("progress"),percent=document.getElementById("percent"),skip=document.getElementById("skip");
let started=performance.now(),frame=0,redirected=false,last=-1;
function go(){if(redirected)return;redirected=true;skip.disabled=true;skip.textContent="Abrindo seu portfólio…";window.location.replace(DESTINATION)}
skip.addEventListener("click",go);
function tick(now){
 if(redirected)return;
 const p=Math.min((now-started)/duration,1),i=Math.min(Math.floor(p*messages.length),messages.length-1);
 if(i!==last){last=i;message.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"translateY(0)"}],{duration:380,easing:"ease-out"});message.textContent=messages[i][0];sub.textContent=messages[i][1]}
 progress.style.width=(p*100)+"%";percent.textContent=Math.floor(p*100).toString().padStart(2,"0")+"%";
 if(p>=1){go();return}frame=requestAnimationFrame(tick);
}
frame=requestAnimationFrame(tick);
})();
</script>
</body></html>
