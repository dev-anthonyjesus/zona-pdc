<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101110">
<title>PRATES A CONHECER — Portfólio PDC</title>
<link rel="icon" type="image/svg+xml" href="assets/zona-favicon.svg?v=49">
<meta name="description" content="Uma infância contada por quem estava lá — portfólio de Psicologia do Desenvolvimento da Criança.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#101110;--sage:#aeb5b1;--lime:#8bd83f;--cream:#f1f3ef;--pink:#aeb5b1;--ink:#101110}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif}
body{min-height:100svh;background:radial-gradient(ellipse at 50% 42%,#20251f 0%,#101110 56%,#080909 100%);color:var(--cream);overflow:hidden}
main{min-height:100svh;display:grid;place-items:center;padding:28px;position:relative;isolation:isolate}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(1px);pointer-events:none}
.blob.one{width:min(75vw,760px);aspect-ratio:1;background:#8bd83f12;left:-25%;bottom:-55%;animation:float 12s ease-in-out infinite}
.blob.two{width:min(42vw,420px);aspect-ratio:1;background:#bfc7c122;right:-12%;top:-25%;animation:float 15s ease-in-out infinite reverse}
.card{width:min(100%,680px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.kicker{font:500 10px "DM Mono",monospace;letter-spacing:.22em;color:#aeb5b1}
.brand{font-size:clamp(12px,2vw,14px);font-weight:900;letter-spacing:.2em;color:var(--lime);text-shadow:0 0 24px #8bd83f55}
.mascot{width:clamp(180px,31vw,270px);height:auto;max-height:42svh;object-fit:contain;filter:drop-shadow(0 18px 34px #000b) drop-shadow(0 0 22px #8bd83f25);animation:bob 3.5s ease-in-out infinite}
.message{font-size:clamp(28px,5.6vw,54px);line-height:1.02;letter-spacing:-.065em;font-weight:900;max-width:650px;min-height:2.1em;display:grid;place-items:center;text-wrap:balance;text-shadow:0 3px 26px #0008}
.sub{font-size:14px;line-height:1.6;color:#b9c0bb;max-width:430px;min-height:3em}
.track{width:min(100%,390px);height:5px;background:linear-gradient(90deg,#343a35,#777e79);border-radius:99px;overflow:hidden;box-shadow:0 0 18px #8bd83f12}
.track span{display:block;width:0;height:100%;background:linear-gradient(90deg,#65b72c,#b2ed72);border-radius:inherit;transition:width .15s linear;box-shadow:0 0 14px #8bd83f88}
.foot{width:min(100%,390px);display:flex;justify-content:space-between;color:#aeb5b1;font:10px "DM Mono",monospace;letter-spacing:.12em}
.skip{margin-top:8px;border:1px solid #8bd83f;border-radius:999px;padding:12px 22px;background:linear-gradient(100deg,#65b72c,#9be34e);color:#101110;font:800 12px "DM Sans",sans-serif;cursor:pointer;transition:.2s;box-shadow:0 8px 28px #8bd83f24}
.skip:hover{filter:brightness(1.12);transform:translateY(-2px)}
.skip:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
.note{font:10px "DM Mono",monospace;color:#aeb5b188;letter-spacing:.14em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes float{50%{transform:translate(25px,-20px) scale(1.05)}}


/* Composição em duas áreas: conteúdo à esquerda, Zeca à direita */
main{display:flex;align-items:center;justify-content:flex-start;padding:clamp(28px,6vw,88px);overflow:hidden}
.card{position:relative;z-index:2;width:min(48vw,610px);margin-left:clamp(0px,3vw,44px);padding:0;gap:20px;align-items:flex-start;text-align:left;transform:none}
.brand{margin:0}
.kicker{font-size:10px}
.message{width:100%;max-width:590px;min-height:2.15em;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-size:clamp(34px,4.6vw,64px);line-height:1.02;letter-spacing:-.065em}
.sub{min-height:2em;text-align:left;font-size:15px}
.track,.foot{width:min(100%,430px)}
.mascot{position:absolute;right:clamp(5vw,10vw,150px);bottom:0;width:clamp(300px,34vw,470px)!important;max-width:42vw;height:auto;max-height:78svh!important;object-fit:contain;object-position:center bottom;z-index:1;filter:drop-shadow(0 0 30px #8bd83f24);animation:bob 4.2s ease-in-out infinite;pointer-events:none}
.skip{align-self:flex-start}
.note{align-self:flex-start}
@media(max-width:760px){
 main{align-items:flex-start;justify-content:center;padding:28px 22px 0}
 .card{width:100%;margin:0;padding:0 0 38svh;gap:15px;align-items:center;text-align:center}
 .brand,.kicker,.message,.sub,.skip,.note{align-self:center;text-align:center}
 .message{justify-content:center;font-size:clamp(32px,8vw,46px);min-height:2.15em}
 .sub{font-size:13px}
 .track,.foot{width:min(100%,390px)}
 .mascot{right:50%;bottom:0;transform:translateX(50%);width:auto!important;height:37svh;max-height:37svh!important;max-width:78vw;object-fit:contain;object-position:center bottom}
}
@media(max-height:620px) and (min-width:761px){
 .card{gap:12px}
 .mascot{max-height:68svh!important}
}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="blob one"></div><div class="blob two"></div>
<section class="card" aria-live="polite">
<div class="brand">PRATES A CONHECER</div>
<div class="kicker">PORTFÓLIO PDC · UFBA · 2026</div>
<img class="mascot" src="assets/1.png?v=49" alt="Zeca, o camaleão" style="width:clamp(180px,31vw,270px);max-height:42svh;object-fit:contain;">
<div class="message" id="message">Olá, Juliana. Como você está?</div>
<p class="sub" id="sub">Estamos preparando uma pequena viagem pela memória.</p>
<div class="track" aria-label="Progresso do carregamento"><span id="progress"></span></div>
<div class="foot"><span>PREPARANDO SUA VISITA</span><span id="percent">00%</span></div>
<button class="skip" id="skip" type="button">Pular e abrir o portfólio ↗</button>
<div class="note">RATOS DE BROFEM BRENER</div>
</section>
</main>
<script>
(()=>{
const DESTINATION="https://herdata.my.canva.site/portifolio-pdc";
const messages=[
["Olá, Juliana. Como você está?","Que bom receber sua visita."],
["Aguarde, estamos preparando tudo para você.","Estamos organizando algumas memórias."],
["O Zeca é o nosso mascote. Você vai gostar dele.","Ele vai acompanhar você nessa experiência."],
["Algumas lembranças estão nas fotografias.","Outras vivem na memória de quem estava lá."],
["Quase tudo pronto.","Pode preparar o café."],
["Ratos de Brofem Brener.","Essa é para quem vai entender."],
["Pronto, Juliana. Pode entrar.","Sua apresentação está logo ali."]
];
const duration=23000;
const message=document.getElementById("message"),sub=document.getElementById("sub"),progress=document.getElementById("progress"),percent=document.getElementById("percent"),skip=document.getElementById("skip");
let started=performance.now(),frame=0,redirected=false,last=-1;
function go(){if(redirected)return;redirected=true;skip.disabled=true;skip.textContent="Abrindo seu portfólio…";window.location.replace(DESTINATION)}
skip.addEventListener("click",go);
function tick(now){
 if(redirected)return;
 const p=Math.min((now-started)/duration,1),i=Math.min(Math.floor(p*messages.length),messages.length-1);
 if(i!==last){last=i;message.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"translateY(0)"}],{duration:380,easing:"ease-out"});message.textContent=messages[i][0];sub.textContent=messages[i][1]}
 progress.style.width=(p*100)+"%";percent.textContent=Math.floor(p*100).toString().padStart(2,"0")+"%";
 if(p>=1){go();return}frame=requestAnimationFrame(tick);
}
frame=requestAnimationFrame(tick);
})();
</script>
</body></html>
